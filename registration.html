<section class="register">

<h1>Event Registration</h1>

<form id="registerForm">

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="college" placeholder="College Name">

<input type="text" id="branch" placeholder="Branch">

<select id="year">
<option value="">Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<select id="event">
<option value="">Select Event</option>
<option>Hackathon</option>
<option>AI Workshop</option>
<option>Web Design</option>
<option>Coding Contest</option>
<option>Robotics</option>
<option>Tech Quiz</option>
</select>

<button type="submit">Register</button>

</form>

</section>

<footer>

<p>© 2026 TechFest | College Event Management Website</p>

</footer>
